name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main]
  workflow_dispatch:   # botón "Run workflow" en GitHub → Actions

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarQube necesita el historial completo para saber qué código es nuevo

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Sin scripts de instalación de terceros; bcrypt los necesita y se ejecutan aparte
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild bcrypt

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov-report/
          retention-days: 7

      # Análisis de calidad del código (configuración en sonar-project.properties).
      # Solo corre cuando el secreto SONAR_TOKEN está creado en GitHub.
      - name: SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vital-training:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name vt-smoke -p 4000:4000 \
            -e JWT_SECRET=ci-secret \
            -e JWT_EXPIRES_IN=8h \
            vital-training:${{ github.sha }}
          sleep 5
          curl -sf http://localhost:4000/api/health || curl -sf http://localhost:4000 || true
          docker stop vt-smoke
          docker rm vt-smoke