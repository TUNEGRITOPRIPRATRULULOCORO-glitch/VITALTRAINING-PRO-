# App + PostgreSQL en local con Docker. Las contraseñas no van aquí: se leen del archivo .env
# (copia .env.example como .env y rellena POSTGRES_PASSWORD y JWT_SECRET).
services:
  db:
    image: postgres:16-alpine
    container_name: vital-training-db
    environment:
      POSTGRES_USER: vitaltraining
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: vitaltraining
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaltraining"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vital-training
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      - JWT_EXPIRES_IN=8h
      - DATABASE_URL=postgresql://vitaltraining:${POSTGRES_PASSWORD}@db:5432/vitaltraining?sslmode=disable
    restart: unless-stopped

volumes:
  pgdata:
