# Configuración para publicar VitalTraining en Render (plan gratuito).
# Guía paso a paso: docs/DESPLIEGUE.md
services:
  - type: web
    name: vital-sports
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Clave para firmar las sesiones: Render la genera sola
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Cadena de conexión de Neon (se pega a mano en Render)
      - key: DATABASE_URL
        sync: false
      # Contraseña del usuario admin@vital.com (se escribe a mano en Render)
      - key: ADMIN_PASSWORD
        sync: false
      # true = crea las cuentas de prueba (contraseñas públicas) y datos de ejemplo, solo para una demo.
      # La app ya la usa gente real: queda en false.
      - key: DATOS_DEMO
        value: "false"
      # Correos con Brevo (opcional, se escriben a mano en Render)
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      # Asistente IA con Claude (opcional, se escribe a mano en Render)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Entrar con Google (opcional, se escribe a mano en Render)
      - key: GOOGLE_CLIENT_ID
        sync: false
