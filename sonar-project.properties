# Análisis de calidad con SonarQube Cloud (sonarcloud.io). Lo lanza .github/workflows/ci.yml.
# La organización y la clave salen de SonarQube Cloud al importar el repositorio:
# si allí aparecen distintas, cámbialas aquí.
sonar.organization=tunegritopripratrululocoro-glitch
sonar.projectKey=TUNEGRITOPRIPRATRULULOCORO-glitch_VITALTRAINING-PRO-
sonar.projectName=VitalTraining

# Código de la app y tests
sonar.sources=servidor,servicios,base-de-datos,interfaz,scripts
sonar.tests=__tests__
sonar.exclusions=**/node_modules/**,coverage/**,base-de-datos/datos-locales/**,interfaz/img/**
sonar.sourceEncoding=UTF-8

# Cobertura de los tests (jest --coverage genera coverage/lcov.info).
# La interfaz y los scripts no tienen tests unitarios: no cuentan para la cobertura.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=interfaz/**,scripts/**
